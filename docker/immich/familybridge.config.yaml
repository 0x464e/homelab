bridge_root: /media/familybridge-recipients
immich_bridge_root: /familybridge-recipients

database: /state/bridge.sqlite
listen: 0.0.0.0:6773
api_token_env: FAMILYBRIDGE_API_TOKEN
poll_interval: 30s

members:
