name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    extends:
      file: hwaccel.transcoding.yml
      service: nvenc
    user: 2000:2000
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${UPLOAD_LOCATION}/familybridge-recipients:/familybridge-recipients:ro
      - /etc/localtime:/etc/localtime:ro
    environment: # stupid portainer workaround for env_file being impossible for gitops
      - UPLOAD_LOCATION=${UPLOAD_LOCATION}
      - DB_DATA_LOCATION=${DB_DATA_LOCATION}
      - TZ=${TZ}
      - IMMICH_VERSION=${IMMICH_VERSION}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - IMMICH_HELMET_FILE=true
    ports:
      - "192.168.10.6:2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    labels:
      - "traefik.enable=true"

      # main route
      - "traefik.http.routers.immich.rule=Host(`photos.ottos.party`)"
      - "traefik.http.routers.immich.entrypoints=lan-https,cf-tunnel"
      - "traefik.http.routers.immich.middlewares=cloudflarewarp@file"

      # aliases route
      - "traefik.http.routers.immich-aliases.rule=HostRegexp(`(immich|gallery)\\.ottos\\.party`)"
      - "traefik.http.routers.immich-aliases.entrypoints=lan-https,cf-tunnel"
      - "traefik.http.routers.immich-aliases.middlewares=cloudflarewarp@file, immich-alias-redirect"
      - "traefik.http.routers.immich-aliases.service=noop@internal"

      # alias redirect middleware
      - "traefik.http.middlewares.immich-alias-redirect.redirectregex.regex=^.*\\.ottos\\.party(.*)$"
      - "traefik.http.middlewares.immich-alias-redirect.redirectregex.replacement=https://photos.ottos.party$1"
      - "traefik.http.middlewares.immich-alias-redirect.redirectregex.permanent=true"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    extends:
      file: hwaccel.ml.yml
      service: cuda
    volumes:
      - model-cache:/cache
    environment: # stupid portainer workaround for env_file being impossible for gitops
      - UPLOAD_LOCATION=${UPLOAD_LOCATION}
      - DB_DATA_LOCATION=${DB_DATA_LOCATION}
      - TZ=${TZ}
      - IMMICH_VERSION=${IMMICH_VERSION}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: immich_pgadmin
    ports:
      - "192.168.10.6:8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - immich-pgadmin-data:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich-pgadmin.rule=Host(`immich-pgadmin.ottos.party`)"
      - "traefik.http.routers.immich-pgadmin.entrypoints=lan-https"

  family-bridge:
    image: 0x464e/immich-family-bridge:0.4.5
    container_name: immich-family-bridge
    user: "${FAMILYBRIDGE_UID:-1000}:${FAMILYBRIDGE_GID:-1000}"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      FAMILYBRIDGE_DRY_RUN: false
      FAMILYBRIDGE_API_TOKEN: ${FAMILYBRIDGE_API_TOKEN:?Set a private bridge API token}
      IMMICH_LIBRARY_ADMIN_KEY: ${IMMICH_LIBRARY_ADMIN_KEY:?Set an admin key with library read/update scopes}
      IMMICH_MEMBER_1_KEY: ${IMMICH_MEMBER_1_KEY:?Set the first family member's bridge API key}
      IMMICH_MEMBER_2_KEY: ${IMMICH_MEMBER_2_KEY:?Set the second family member's bridge API key}
    volumes:
      - ./familybridge.config.yaml:/etc/familybridge/config.yaml:ro
      - ${UPLOAD_LOCATION}:/media:rw
      - /srv/immich/familybridge-state:/state
    ports:
      - "127.0.0.1:${FAMILYBRIDGE_PORT:-6773}:6773"
    depends_on:
      - immich-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6773/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  model-cache:
  immich-pgadmin-data:
