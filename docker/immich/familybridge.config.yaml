family_id: otto-jasmin
immich_url: http://immich-server:2283/api
admin_key_env: IMMICH_LIBRARY_ADMIN_KEY

source_root: /media
source_mappings:
  - immich_root: /data/library
    local_root: /media/library
  - immich_root: /data/upload
    local_root: /media/upload
  - immich_root: /data/encoded-video
