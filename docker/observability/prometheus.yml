global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 30d

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: truenas-graphite
    honor_labels: true
    static_configs:
      - targets:
          - graphite-exporter:9108
